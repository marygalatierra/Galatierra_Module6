<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>
</head>

<body>

<h1>Student List</h1>

<p>
    <a href="{% url 'student_dashboard' %}">
        Student Dashboard
    </a>
</p>

<p>
    <a href="{% url 'student_create' %}">
        Add Student
    </a>
</p>

<table border="1" cellpadding="8">

    <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Program</th>
            <th>Year Level</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>

        {% for student in students %}

        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.email }}</td>
            <td>{{ student.program }}</td>
            <td>{{ student.year_level }}</td>

            <td>
                <a href="{% url 'student_edit' student.id %}">
                    Edit
                </a>

                |

                <a href="{% url 'student_delete' student.id %}">
                    Delete
                </a>
            </td>
        </tr>

        {% empty %}

        <tr>
            <td colspan="5">
                No students found.
            </td>
        </tr>

        {% endfor %}

    </tbody>

</table>

<p>
    <a href="{% url 'logout' %}">
        Logout
    </a>
</p>

</body>
</html>
